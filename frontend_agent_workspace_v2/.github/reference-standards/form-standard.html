<form class="ux-local-form" action="#" method="post">
    <div class="ux-local-field">
        <label class="ux-local-label" for="full-name">Nombre completo</label>
        <input class="ux-local-input" id="full-name" name="full-name" type="text" autocomplete="name" aria-describedby="full-name-help">
        <span class="ux-local-help" id="full-name-help">Introduce nombre y apellidos.</span>
    </div>
    <div class="ux-local-field">
        <label class="ux-local-label" for="category">Categoría</label>
        <select class="ux-local-select" id="category" name="category">
            <option value="">Selecciona una opción</option>
            <option value="a">Opción A</option>
            <option value="b">Opción B</option>
        </select>
    </div>
    <div class="ux-local-panel-footer">
        <button class="ux-local-btn-secondary" type="reset">Limpiar</button>
        <button class="ux-local-btn-primary" type="submit">Guardar</button>
    </div>
</form>
